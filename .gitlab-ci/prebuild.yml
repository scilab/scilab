# This YAML file describe the prebuild stage of the CI. This stage is used to
# cleanup runners and set them ready to build.
#

# define x86_64-linux-gnu env variables
linux_set_env:
  image: ${SCI_REGISTRY_IMAGE}/linux-builder:${DOCKER_TAG}
  stage: prebuild
  tags: [x86_64-linux-gnu, docker, scilab]
  variables:
    GIT_STRATEGY: none
  script:
    - echo BRANCH=$BRANCH
    - echo CI_COMMIT_BRANCH=$CI_COMMIT_BRANCH
    - echo CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - echo CI_COMMIT_TAG=$CI_COMMIT_TAG
    # get current build machine architecture
    - ARCH=$(cc -print-multiarch)
    # define NOW as Gitlab display ISO 8601 timestamp
    - date +"%s" >timestamp
    - NOW=$(cat timestamp)
    # export useful variables
    - |
      echo ARCH=$ARCH                             >build.env
      echo SCI_VERSION_TIMESTAMP=$NOW             >>build.env
      cat build.env
    - echo SCI_VERSION_STRING=$SCI_VERSION_STRING
    # display configured variables
    - gcc --version
    - echo JAVA_HOME=$JAVA_HOME
    - javac -version
  artifacts:
    reports:
      dotenv: build.env

# define windows env
.windows_set_env:
  stage: prebuild
  tags: [shell, scilab]
  needs: []
  variables:
    GIT_STRATEGY: none
  script:
    - echo BRANCH=$env:BRANCH
    - echo CI_COMMIT_BRANCH=$env:CI_COMMIT_BRANCH
    - echo CI_MERGE_REQUEST_TARGET_BRANCH_NAME=$env:CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    - echo CI_COMMIT_TAG=$env:CI_COMMIT_TAG
    # define NOW as Gitlab display ISO 8601 timestamp
    - $Now=(Get-Date(Get-Date).ToUniversalTime() -uformat '%s')
    # define ARCH (prereqs & binaries naming convention) according to PROCESSOR_ARCHITECTURE
    - if ($env:PROCESSOR_ARCHITECTURE -eq "AMD64") { $ARCH="x64" } else { $ARCH="arm64" }
    # export useful variables
    - |
      Set-Content -Path build.env -Value "ARCH=$ARCH","SCI_VERSION_TIMESTAMP=$Now"
      cat build.env
    - echo SCI_VERSION_STRING=$env:SCI_VERSION_STRING
    # display configured variables
    - where.exe devenv cl javac
    - echo VS2026INSTALLDIR=$env:VS2026INSTALLDIR
    - echo SCILAB_JDK64=$env:SCILAB_JDK64
    - if ($env:SCILAB_JDK64) { &"$env:SCILAB_JDK64\bin\javac" -version }
    - echo JAVA_HOME=$env:JAVA_HOME
    - javac -version
  artifacts:
    reports:
      dotenv: build.env

# define x64 windows env
windows_x64_set_env:
  extends: .windows_set_env
  tags: [x64_windows]

# define arm64 windows env
windows_arm64_set_env:
  extends: .windows_set_env
  tags: [arm64_windows]

# rebuild linux dependencies
linux_build_prereq:
  image: ${SCI_REGISTRY_IMAGE}/linux-prebuild:${DOCKER_TAG}
  stage: prebuild
  tags: [x86_64-linux-gnu, docker, scilab, build]
  needs:
    - linux_set_env
  before_script: bash .gitlab-ci/prebuild.sh versions
  script: bash -x -e .gitlab-ci/prebuild.sh fromscratch
  artifacts:
    paths:
      - prerequirements-${SCI_VERSION_STRING}.bin.${ARCH}.tar.xz
      - $SCI_VERSION_STRING
    when: always
  rules:
    # do not rebuild on scheduled
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # do not rebuild on tag
    - if: $CI_COMMIT_TAG
      when: never
    # rebuild on demand
    - changes: &PREBUILD_LINUX_CHANGED
        - .gitlab-ci/prebuild.yml
        - .gitlab-ci/prebuild.sh
        - .gitlab-ci/Dockerfile.linux
        - .gitlab-ci/Dockerfile.linux.prebuild
    # rebuild on a dedicated branch without MR
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        paths: *PREBUILD_LINUX_CHANGED
        compare_to: ${CI_DEFAULT_BRANCH}

# update windows dependencies
.windows_build_prereq:
  stage: prebuild
  tags: [shell, scilab]
  before_script: cmd /C "call .gitlab-ci/prebuild.bat version"
  script: cmd /C "call .gitlab-ci/prebuild.bat fromscratch"
  artifacts:
    paths:
      - prerequirements-${SCI_VERSION_STRING}-windows_${ARCH}.zip
      - $SCI_VERSION_STRING
    when: always
  rules:
    # do not rebuild on scheduled
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    # do not rebuild on tag
    - if: $CI_COMMIT_TAG
      when: never
    # rebuild on demand
    - changes: &PREBUILD_WINDOWS_CHANGED
        - .gitlab-ci/prebuild.yml
        - .gitlab-ci/prebuild.bat
    # rebuild on a dedicated branch without MR
    - if: $CI_PIPELINE_SOURCE == "push"
      changes:
        paths: *PREBUILD_WINDOWS_CHANGED
        compare_to: ${CI_DEFAULT_BRANCH}
# update x64 windows dependencies
windows_x64_build_prereq:
  extends: .windows_build_prereq
  tags: [x64_windows, build]
  needs:
    - windows_x64_set_env
# update arm64 windows dependencies
windows_arm64_build_prereq:
  extends: .windows_build_prereq
  tags: [arm64_windows, build]
  needs:
    - windows_arm64_set_env

# Clean up the Windows common folder, TMPDIR, uninstall Scilab, and kill any remaining Scilab processes.
.windows_cleanup:
  stage: prebuild
  tags: [shell, scilab]
  script:
    - echo "Starting Windows Common path cleanup..."
    - powershell -NoProfile -ExecutionPolicy Bypass -File ".gitlab-ci\cleanup_windows.ps1"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  allow_failure: true
# Clean up x64 Windows common folder
windows_x64_cleanup:
  extends: .windows_cleanup
  tags: [x64_windows]
  needs:
    - windows_x64_set_env
# Clean up arm64 Windows common folder
windows_arm64_cleanup:
  extends: .windows_cleanup
  tags: [arm64_windows]
  needs:
    - windows_arm64_set_env
