# This YAML file describe the postbuild stage of the CI. This stage is mostly
# optional and generate/build extra documentation from Scilab build.
#

# build javadoc
build_javadoc:
  stage: postbuild
  tags: [x86_64-linux-gnu, docker, scilab]
  image: docker.io/openjdk:8-jdk-alpine
  dependencies: []
  script:
    - MASK="scilab/modules/*/src/java/";
    - MODULES=`ls -d $MASK`;
    - |
      LISTPKG="";
      for M in $MODULES; do
        LISTMODULES="$M:$LISTMODULES";
        MODULE=$(echo $M|cut -d/ -f3);
        LISTPKG="$LISTPKG org.scilab.modules.$MODULE";
      done;
    - javadoc -d public/javadoc -sourcepath $LISTMODULES $LISTPKG
  artifacts:
    paths:
      - public
  when: manual


# Check the help files on merge request against RelaxNG schema
check_help:
  stage: test
  tags: [x86_64-linux-gnu, docker, scilab]
  image: ${SCI_REGISTRY_IMAGE}/ubuntu-22.04:${DOCKER_TAG}
  variables:
    ARTIFACT_DOWNLOAD_ATTEMPTS: 3
    EXECUTOR_JOB_SECTION_ATTEMPTS: 3
    GET_SOURCES_ATTEMPTS: 3
    GIT_STRATEGY: "fetch"
  retry:
    max: 2
    when: runner_system_failure
  script:
    - tar -xJf "${SCI_VERSION_STRING}.bin.${ARCH}.tar.xz" -C $HOME
    - |
      $HOME/${SCI_VERSION_STRING}/bin/scilab -nwni -quit <<EOF
      assert_checktrue(check_help([],'en_US','${SCI_VERSION_STRING}/check_help.xml'))
      EOF
  needs:
    - linux_build_mr
    - linux_set_env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - scilab/modules/*/help/**/*.xml
  artifacts:
    when: always
    paths:
      - "${SCI_VERSION_STRING}/check_help.xml"
    reports:
      junit: "${SCI_VERSION_STRING}/check_help.xml"

# build Doxygen
build_doxygen:
  stage: postbuild
  tags: [x86_64-linux-gnu, docker, scilab]
  image: docker.io/tsgkadot/docker-doxygen
  dependencies: []
  script:
    - cd scilab
    - mkdir reports
    - doxygen modules/development_tools/etc/doxyfile >/dev/null
    - mv reports/html $CI_PROJECT_DIR/public/doxygen
  artifacts:
    when: always
    paths:
      - public
  when: manual

# build preview of help.scilab.org
build_help_web:
  stage: postbuild
  tags: [x86_64-linux-gnu, docker, scilab]
  image: ${SCI_REGISTRY_IMAGE}/linux-builder:${DOCKER_TAG}
  dependencies: []
  script:
    - cd scilab
    - make doc-web
    - "[ ! -d public ] && mkdir public"
    - mv modules/helptools/web $CI_PROJECT_DIR/public/docs
  artifacts:
    paths:
      - public
  when: manual


# start scilab on multiple distro 
.linux_startup:
  stage: postbuild
  tags: [x86_64-linux-gnu, docker, scilab]
  image: ${SCI_REGISTRY_IMAGE}/$DISTRO:${DOCKER_TAG}
  script:
    - tar -xJf "${SCI_VERSION_STRING}.bin.${ARCH}.tar.xz" -C $HOME
    - cd $HOME
    - export SCIVERBOSE=1
    - xvfb-run ${SCI_VERSION_STRING}/bin/scilab $MODE -e "disp(getscilabmode()); if getscilabmode() <> 'NWNI' then plot(); end" -quit
  parallel:
    matrix:
      - DISTRO:
          - "ubuntu-22.04"
          - "ubuntu-24.04"
          - "ubuntu-25.04"
          - "fedora-42"
          - "debian-13"
        MODE: ["-nwni", "-nw"]

linux_startup_mr:
  extends: .linux_startup
  needs:
    - linux_build_mr
    - linux_set_env
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "push"

linux_startup_nightly:
  extends: .linux_startup
  needs:
    - linux_build_nightly
    - linux_set_env
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

linux_startup_release:
  extends: .linux_startup
  needs:
    - linux_build_release
    - linux_set_env
  rules:
    - if: $CI_COMMIT_TAG
